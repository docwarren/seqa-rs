name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Runs on every push and PR — no cloud credentials needed
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build

      - name: Local store test
        run: cargo test -p seqa_core --test local

      - name: Reference data and integrity tests
        run: cargo test -p seqa_core --test reference_data --test reference_data_integrity

      - name: Axum tests
        run: |
          cargo test -p seqa_axum test_index
          cargo test -p seqa_axum test_search_unsupported_file_type
          cargo test -p seqa_axum test_search_missing_coordinates
          cargo test -p seqa_axum test_search_invalid_json
          cargo test -p seqa_axum test_404
