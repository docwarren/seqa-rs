[package]
name = "seqa_api"
version = "0.1.0"
edition = "2024"
authors = ["Andrew Warren"]
rust-version = "1.94.0"
description = "Request and response types, notes storage and URI checks shared by the seqa backends"
license = "Apache-2.0"
repository = "https://github.com/docwarren/seqa-rs"
homepage = "https://www.seqa23.com"

[dependencies]
seqa_core = { path = "../seqa_core", version = "10.0.0" }
serde = { version = "1.0.219", features = ["derive"] }
thiserror = "2.0.16"
url = "2.5.4"
object_store = { version = "0.12.4", features = ["aws"] }
base64 = "0.22.1"

[dev-dependencies]
tokio = { version = "1.44.2", features = ["macros", "rt-multi-thread"] }
serde_json = "1.0"
