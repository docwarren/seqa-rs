[package]
name = "seqa_axum"
version = "7.0.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1.44", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "normalize-path"] }
seqa_api = { path = "../seqa_api" }
seqa_core = { path = "../seqa_core" }
serde = { version = "1.0.219", features = ["derive"] }
moka = { version = "0.12", features = ["future"] }
thiserror = "2.0.20"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
serde_json = "1.0"
object_store = { version = "=0.14.2", features = ["aws"] }
url = "2.5.4"
