[package]
name = "seqa"
version = "3.0.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.41", features = ["derive"] }
seqa_core = { path = "../seqa_core", features = ["sqlite"] }
tokio = { version = "1.47.0", features = ["macros", "rt-multi-thread"] }
log = "0.4.29"
env_logger = "0.11.10"
anyhow = "1.0.104"

[profile.release]
debug = true
