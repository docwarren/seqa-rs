[package]
name = "seqa_lambda"
version = "5.0.0"
edition = "2021"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
lambda_http = {  version = "1.0.0", features = ["apigw_http", "concurrency-tokio"] }
seqa_api = { path = "../seqa_api" }
seqa_core = { path = "../seqa_core" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1.0.149"

[dev-dependencies]
object_store = { version = "0.14.2", features = ["aws"] }
url = "2.5.4"
