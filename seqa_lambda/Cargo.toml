[package]
name = "seqa_lambda"
version = "3.0.1"
edition = "2021"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
lambda_http = {  version = "1.0.0", features = ["apigw_http", "concurrency-tokio"] }
seqa_core = { path = "../seqa_core", features = ["sqlite"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1.0.149"
